<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Hanken+Grotesk:wght@400..700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;background:#F0EEE6;font-family:"Hanken Grotesk",system-ui;
  display:flex;flex-direction:column;justify-content:center;padding:74px 80px;position:relative;overflow:hidden}
.eyebrow{font-family:"JetBrains Mono",monospace;font-size:17px;letter-spacing:.16em;text-transform:uppercase;color:#6B6B6B;margin-bottom:26px}
h1{font-family:"Bricolage Grotesque",system-ui;font-size:82px;line-height:1.02;letter-spacing:-.03em;color:#0D0D0D;font-weight:700;max-width:16ch}
h1 em{font-style:normal;color:#734D98}
p{font-size:25px;color:#6B6B6B;margin-top:26px;max-width:30ch;line-height:1.4}
.chips{display:flex;gap:14px;margin-top:44px}
.chips i{width:78px;height:78px;border-radius:20px;box-shadow:0 3px 10px rgba(61,44,30,.10)}
.mark{position:absolute;right:76px;top:64px;width:92px;height:92px;border-radius:26px;background:#734D98;
  display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:21px}
.mark b{border-radius:50%;display:block}
.foot{position:absolute;right:80px;bottom:62px;font-family:"JetBrains Mono",monospace;font-size:19px;color:#734D98;letter-spacing:.02em}
</style></head><body>
<div class="mark"><b style="background:#F0EEE6"></b><b style="background:#FF6B6B"></b><b style="background:#4ECDC4"></b><b style="background:#FFE66D"></b></div>
<div class="eyebrow">Free · No sign up</div>
<h1>Your whole brand kit in <em>five questions.</em></h1>
<p>Colours that pass contrast, fonts, a logo and a brand guide. Built in your browser.</p>
<div class="chips">
  <i style="background:#734D98"></i><i style="background:#5D3E7A"></i><i style="background:#4ECDC4"></i>
  <i style="background:#FF6B6B"></i><i style="background:#FFE66D"></i><i style="background:#FFFFFF;box-shadow:inset 0 0 0 1.5px #D4CFC1"></i>
</div>
<div class="foot">brandkit.prompts2products.com</div>
</body></html>
